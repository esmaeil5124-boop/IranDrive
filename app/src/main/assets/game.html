<!DOCTYPE html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Iran Drive</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Tahoma,Arial;color:white}canvas{display:block;width:100vw;height:100vh;background:#7ac}#hud{position:absolute;inset:0;pointer-events:none}#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{background:#111b;border:1px solid #ffffff44;border-radius:14px;padding:8px 12px;font-size:14px}#controls{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:auto}.cluster{display:flex;gap:12px;align-items:center}.btn{width:68px;height:68px;border-radius:50%;border:2px solid #ffffff99;background:#17232dcc;color:white;font-size:22px;font-weight:bold;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center}.btn.small{width:60px;height:60px;font-size:16px}.btn.turbo{background:#d8490dcc;border-color:#ffc46a;width:82px;height:82px}.btn:active{background:#ffffff55}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,500px);background:#101827f2;border:1px solid #ffffff40;border-radius:20px;padding:18px;text-align:center;pointer-events:auto;box-shadow:0 15px 60px #0008}.panel h1{margin:0 0 10px}.panel p{line-height:1.7}.panel button,.panel select{padding:12px;border-radius:12px;border:0;margin:5px;font-size:16px}.panel button{background:#19a974;color:white;font-weight:bold}.panel select{background:#eee;color:#222}.hidden{display:none}.tiny{font-size:12px;color:#ddd}</style></head><body>
<canvas id="c"></canvas><div id="hud"><div id="top"><div class="pill" id="city">🇮🇷 تهران</div><div class="pill" id="speed">0 km/h</div><div class="pill" id="carname">پژو ۴۰۵</div></div><div id="controls" class="hidden"><div class="cluster"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><div class="cluster"><button class="btn small" id="brake">ترمز</button><button class="btn turbo" id="turbo">TURBO</button><button class="btn" id="gas">▲</button></div></div>
<div class="panel" id="menu"><h1>🇮🇷 ایران‌درایو</h1><p>رانندگی آزاد در شهر و جاده‌های کوهستانی</p><div><label>ماشین: </label><select id="cars"><option>پژو ۴۰۵</option><option>پراید</option><option>سمند</option><option>دنا پلاس</option><option>BMW M3</option><option>Mercedes AMG</option><option>Lamborghini</option></select></div><div><label>محیط: </label><select id="cities"><option value="tehran">🇮🇷 تهران — برج آزادی و میلاد</option><option value="mountain">🏔️ جاده کوهستانی</option><option value="paris">🇫🇷 پاریس — برج ایفل</option><option value="london">🇬🇧 لندن — بیگ‌بن</option><option value="rome">🇮🇹 رم — کولوسئوم</option><option value="tokyo">🇯🇵 توکیو — برج توکیو</option><option value="ny">🇺🇸 نیویورک — آسمان‌خراش</option></select></div><button id="start">شروع رانندگی</button><p class="tiny">در حالت افقی بازی کن • لمس دکمه‌ها برای حرکت • توربو با نگه داشتن</p></div><div class="panel hidden" id="pause"><h2>بازی متوقف شد</h2><button id="resume">ادامه</button><button id="back">منو</button></div></div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,dpr,playing=false,paused=false, speed=0,steer=0,carX=0,roadOffset=0,turbo=0,city='tehran',car='پژو ۴۰۵',time=0,traffic=[];
const keys={left:false,right:false,gas:false,brake:false,turbo:false};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const cityNames={tehran:'🇮🇷 تهران',mountain:'🏔️ جاده کوهستانی',paris:'🇫🇷 پاریس',london:'🇬🇧 لندن',rome:'🇮🇹 رم',tokyo:'🇯🇵 توکیو',ny:'🇺🇸 نیویورک'};
function start(){car=document.getElementById('cars').value;city=document.getElementById('cities').value;document.getElementById('carname').textContent=car;document.getElementById('city').textContent=cityNames[city];document.getElementById('menu').classList.add('hidden');document.getElementById('pause').classList.add('hidden');document.getElementById('controls').classList.remove('hidden');playing=true;paused=false;speed=0;carX=0;traffic=[];for(let i=0;i<8;i++)traffic.push({x:(Math.random()*1.6-0.8),z:Math.random()*2+1})}
document.getElementById('start').onclick=start;document.getElementById('resume').onclick=()=>{paused=false;document.getElementById('pause').classList.add('hidden')};document.getElementById('back').onclick=()=>{playing=false;document.getElementById('pause').classList.add('hidden');document.getElementById('controls').classList.add('hidden');document.getElementById('menu').classList.remove('hidden')};
function bind(id,key){let el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true},up=e=>{e.preventDefault();keys[key]=false};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)}
bind('left','left');bind('right','right');bind('gas','gas');bind('brake','brake');bind('turbo','turbo');addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(['ArrowUp','w','W'].includes(e.key))keys.gas=true;if(['ArrowDown','s','S'].includes(e.key))keys.brake=true;if(e.key===' ')keys.turbo=true;if(e.key==='Escape'&&playing){paused=!paused;document.getElementById('pause').classList.toggle('hidden',!paused)}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false;if(['ArrowUp','w','W'].includes(e.key))keys.gas=false;if(['ArrowDown','s','S'].includes(e.key))keys.brake=false;if(e.key===' ')keys.turbo=false});
function sky(){let g=ctx.createLinearGradient(0,0,0,H*.65);g.addColorStop(0,'#70c6ef');g.addColorStop(1,'#d9f2ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function drawLand(){ctx.fillStyle=city==='mountain'?'#5b8753':'#55894a';ctx.fillRect(0,H*.45,W,H*.55);if(city==='mountain'){for(let i=0;i<9;i++){let x=i*W/8-50;ctx.fillStyle=['#73858b','#667a83','#8a9697'][i%3];ctx.beginPath();ctx.moveTo(x,H*.48);ctx.lineTo(x+W*.12,H*.12+Math.sin(i)*40);ctx.lineTo(x+W*.24,H*.48);ctx.fill();ctx.fillStyle='#e7f1f4';ctx.beginPath();ctx.moveTo(x+W*.12,H*.12+Math.sin(i)*40);ctx.lineTo(x+W*.16,H*.28);ctx.lineTo(x+W*.09,H*.25);ctx.fill();}}else{for(let i=0;i<18;i++){let x=i*W/17;let bh=H*(.12+((i*13)%8)/50);ctx.fillStyle=i%3?'#8b979b':'#c3b5a2';ctx.fillRect(x,H*.45-bh,W/20,bh);ctx.fillStyle='#385d37';for(let j=0;j<3;j++)ctx.fillRect(x+4,H*.45-bh+j*16,W/20-8,8)}}}
function drawRoad(){let cx=W/2+carX*W*.25;ctx.fillStyle='#3c3e43';ctx.beginPath();ctx.moveTo(W*.36,H*.45);ctx.lineTo(W*.64,H*.45);ctx.lineTo(W*.95,H);ctx.lineTo(W*.05,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#eee';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.36,H*.45);ctx.lineTo(W*.05,H);ctx.moveTo(W*.64,H*.45);ctx.lineTo(W*.95,H);ctx.stroke();for(let i=0;i<14;i++){let y=H*.46+i*H*.04+(roadOffset%(H*.04));let ww=4+i*2;ctx.fillStyle='#f4db61';ctx.fillRect(W/2-ww/2,y,ww,Math.max(5,i*1.8))}}
function drawTower(){let x=W*.18,y=H*.43;ctx.fillStyle='#eee';if(city==='tehran'){ctx.fillRect(x,y-80,24,80);ctx.beginPath();ctx.moveTo(x-12,y-80);ctx.lineTo(x+12,y-80);ctx.lineTo(x,y-110);ctx.fill();ctx.fillStyle='#d6d6d6';ctx.fillRect(W*.8,y-100,25,100);ctx.fillStyle='#6cc';ctx.fillRect(W*.8+5,y-95,15,90)}else if(city==='paris'){ctx.strokeStyle='#59442c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+10,y-100);ctx.lineTo(x+20,y);ctx.moveTo(x+5,y-60);ctx.lineTo(x+15,y-60);ctx.stroke()}else if(city==='london'){ctx.fillStyle='#ddc8a3';ctx.fillRect(x,y-80,30,80);ctx.fillRect(x+6,y-100,18,20)}else if(city==='rome'){ctx.fillStyle='#c6a36d';ctx.fillRect(x,y-45,80,45);for(let i=0;i<5;i++){ctx.fillStyle='#423';ctx.fillRect(x+8+i*15,y-22,8,22)}}else if(city==='tokyo'){ctx.fillStyle='#ee5b36';ctx.fillRect(x,y-90,20,90);ctx.fillStyle='#fff';ctx.fillRect(x+5,y-80,10,10)}else if(city==='ny'){ctx.fillStyle='#8999aa';ctx.fillRect(x,y-100,30,100);ctx.fillRect(x+36,y-65,24,65)}}
function drawCar(x,y,scale,color,player=false){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#16191b';ctx.fillRect(-32,-12,64,38);ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-26,-10);ctx.lineTo(-18,-30);ctx.lineTo(18,-30);ctx.lineTo(26,-10);ctx.lineTo(32,18);ctx.lineTo(-32,18);ctx.closePath();ctx.fill();ctx.fillStyle='#9ed6e8';ctx.fillRect(-17,-25,34,13);ctx.fillStyle='#222';ctx.fillRect(-27,-2,12,18);ctx.fillRect(15,-2,12,18);ctx.fillStyle='#ffe';ctx.fillRect(-24,12,8,4);ctx.fillRect(16,12,8,4);ctx.restore()}
function frame(){requestAnimationFrame(frame);if(!paused){time+=.016;if(playing){if(keys.gas)speed+=.6;else speed-=.08;if(keys.brake)speed-=1.4;speed=Math.max(0,Math.min(speed,keys.turbo?245:180));if(keys.turbo&&speed>30)turbo=1;else turbo=Math.max(0,turbo-.03);steer=(keys.left?-1:0)+(keys.right?1:0);carX+=steer*.018*(speed/100);carX=Math.max(-1.1,Math.min(1.1,carX));roadOffset+=speed*.014;traffic.forEach(t=>{t.z-=speed*.0005;if(t.z<.1)t.z=2.4;t.x+=Math.sin(time+t.z)*.002});document.getElementById('speed').textContent=Math.round(speed)+' km/h'}}sky();drawLand();drawRoad();drawTower();traffic.forEach(t=>drawCar(W/2+t.x*W*.25,H*.45+t.z*H*.2,Math.max(.15,t.z*.55),'#f1f1f1'));drawCar(W/2+carX*W*.25,H*.83,1.35,car==='پراید'?'#fafafa':car==='BMW M3'?'#1c61bd':car==='Lamborghini'?'#e5cf27':'#d84343',true);if(turbo){ctx.fillStyle='#ff7b26';ctx.beginPath();ctx.moveTo(W/2+carX*W*.25-10,H*.88);ctx.lineTo(W/2+carX*W*.25,H*.98);ctx.lineTo(W/2+carX*W*.25+10,H*.88);ctx.fill()}}frame();
})();
</script></body></html>
